# Physics channel config: proton-DVCS (ep -> epgamma, BH+DVCS) via
# genepi (https://github.com/N-Plx/genepi), the generator used for
# Fig. 5-7 of the RGC Jeopardy Update Document. PHYSICS=dvcs.
# Physics parameters live in dvcs.params, not here.
#
# NEVENTS here means raw trial draws, NOT guaranteed kept events (genepi
# uses keep/reject acceptance -- ~0.07% for the default kinematic range,
# so NEVENTS needs to be ~1000x the events you actually want out).
#
# KNOWN LIMITATION: genepi's VERTEX is a single fixed z point, no
# z-width/length parameter (confirmed in read_optFile.cc's full keyword
# list) -- can't reproduce the real NH3/ND3 target's finite z length.

GCARD_DEFAULT="rgc_summer2022.gcard"

run_generator() {
    local nevents=$1 seed=$2 jobdir=$3
    local gendir="$jobdir/genepi_run"
    source "$SCRIPT_DIR/configs/dvcs.params"

    mkdir -p "$gendir"
    cp "$WORKROOT/genepi/bin/genepi.exe" "$gendir/"
    cp "$WORKROOT/genepi/gpd_table.dat" "$gendir/"
    cp "$WORKROOT/genepi/input_files/example_input_file.input" "$gendir/run.input"

    sed -i \
        -e "s/^GENE EVENTS.*/GENE EVENTS $nevents/" \
        -e "s/^BEAM    ENERGY.*/BEAM    ENERGY   $BEAM_ENERGY/" \
        -e "s/^TARGET A.*/TARGET A        $TARGET_A/" \
        -e "s/^TARGET Z.*/TARGET Z        $TARGET_Z/" \
        -e "s/^KINEMATIC  XBJ.*/KINEMATIC  XBJ      $XBJ_MIN       $XBJ_MAX/" \
        -e "s/^KINEMATIC  Y .*/KINEMATIC  Y        $Y_MIN       $Y_MAX/" \
        -e "s/^KINEMATIC  Q2.*/KINEMATIC  Q2       $Q2_MIN      $Q2_MAX/" \
        -e "s/^KINEMATIC  W2.*/KINEMATIC  W2       $W2_MIN      $W2_MAX/" \
        -e "s/^KINEMATIC  NU.*/KINEMATIC  NU       $NU_MIN      $NU_MAX/" \
        -e "s/^KINEMATIC  T .*/KINEMATIC  T        $T_MIN       $T_MAX/" \
        -e "s/^GPD    TYPE.*/GPD    TYPE   $GPD_TYPE/" \
        -e "s/^VERTEX    X.*/VERTEX    X   $VERTEX_X/" \
        -e "s/^VERTEX    Y.*/VERTEX    Y   $VERTEX_Y/" \
        -e "s/^VERTEX    Z.*/VERTEX    Z   $VERTEX_Z/" \
        -e "s/^RASTER    X.*/RASTER    X   $RASTER_X/" \
        -e "s/^RASTER    Y.*/RASTER    Y   $RASTER_Y/" \
        "$gendir/run.input"
    # No SEED VALUE field exists -- genepi seeds from the machine clock.

    module purge
    module load gcc/14.2.0 openmpi/5.0.7 root/6.38.00 tbb/2022.3.0

    ( cd "$gendir" && ./genepi.exe run.input )

    local f
    f=$(find "$gendir" -maxdepth 1 -name 'events_*.dat' | head -1)
    if [[ -z "$f" ]] || [[ ! -s "$f" ]]; then
        echo "ERROR: genepi produced no (or an empty) LUND file -- check $gendir/summary.dat" >&2
        return 1
    fi
    mv "$f" "$jobdir/eventfiles/gen.dat"
}
