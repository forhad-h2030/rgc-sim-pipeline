# Physics channel config: exclusive J/psi photoproduction (e+e- decay)
# via JPsiGen (https://github.com/JeffersonLab/JPsiGen).
# Sourced by rivanna_pipeline.slurm when PHYSICS=jpsi.
# Physics parameters live in jpsi.params, not here.
#
# Note: JPsiGen has no CLI-argument interface for event count/seed (the
# README describes a GenerateGenOptions.py wrapper that does not actually
# exist in the repo -- confirmed by listing the real repo tree). It's
# driven entirely by editing GenOptions.dat before running, which is what
# run_generator() below does, in a per-job copy so concurrent jobs never
# fight over the same GenOptions.dat / output file.

GCARD_DEFAULT="rgc_summer2022.gcard"

run_generator() {
    local nevents=$1 seed=$2 jobdir=$3
    local gendir="$jobdir/jpsigen_run"
    source "$SCRIPT_DIR/configs/jpsi.params"

    mkdir -p "$gendir"
    cp "$WORKROOT/JPsiGen/JPsiGen.exe" "$WORKROOT/JPsiGen/GenOptions.dat" "$gendir/"
    cp -r "$WORKROOT/JPsiGen/lib" "$gendir/"

    sed -i \
        -e "s/^Nsim.*/Nsim     $nevents/" \
        -e "s/^NPerFile.*/NPerFile $nevents/" \
        -e "s/^Eb.*/Eb       $BEAM_ENERGY/" \
        -e "s/^tLim.*/tLim     $T_LIM/" \
        -e "s/^lTarg.*/lTarg    $TARGET_LENGTH/" \
        -e "s/^EgMin.*/EgMin    $EG_MIN/" \
        -e "s/^EgMax.*/EgMax    $EG_MAX/" \
        -e "s/^vzMax.*/vzMax    $VZ_MAX/" \
        -e "s/^vzMin.*/vzMin    $VZ_MIN/" \
        -e "s/^Q2Cut.*/Q2Cut    $Q2_CUT/" \
        -e "s/^tSlope.*/tSlope   $T_SLOPE/" \
        -e "s/^LUND.*/LUND     1/" \
        -e "s/^Seed.*/Seed     $seed/" \
        -e "s/^Fermi.*/Fermi    $FERMI/" \
        -e "s/^LepType.*/LepType	 $LEP_TYPE/" \
        "$gendir/GenOptions.dat"

    module purge
    module load gcc/14.2.0 openmpi/5.0.7 root/6.38.00 tbb/2022.3.0

    (
        cd "$gendir"
        export LD_LIBRARY_PATH="$gendir/lib:$LD_LIBRARY_PATH"
        ./JPsiGen.exe
    )

    if [[ ! -s "$gendir/JPsiGen.dat" ]]; then
        echo "ERROR: JPsiGen did not produce JPsiGen.dat" >&2
        return 1
    fi
    mv "$gendir/JPsiGen.dat" "$jobdir/eventfiles/gen.dat"
}
