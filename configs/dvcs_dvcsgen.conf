# Physics channel config: proton-DVCS via dvcsgen
# (https://github.com/JeffersonLab/dvcsgen) -- an alternative to genepi
# (configs/dvcs.conf), not what the RGC Jeopardy paper's Fig. 5-7 used,
# but a more actively-maintained, CLI-driven generator (unlike genepi's
# edit-a-template-file approach). Sourced when PHYSICS=dvcs_dvcsgen.
# Physics parameters live in dvcs_dvcsgen.params, not here.
#
# Unlike genepi, --trig here means guaranteed kept events, same as
# clasdis/JPsiGen (confirmed: --trig 1000 produced exactly 1000 events
# in verification testing) -- no raw-trial/acceptance-rate confusion.

GCARD_DEFAULT="rgc_summer2022.gcard"

run_generator() {
    local nevents=$1 seed=$2 jobdir=$3
    local gendir="$jobdir/dvcsgen_run"
    source "$SCRIPT_DIR/configs/dvcs_dvcsgen.params"

    mkdir -p "$gendir"
    cp "$WORKROOT/dvcsgen/dvcsgen" "$gendir/"
    cp "$WORKROOT/dvcsgen/gpd.dat" "$gendir/"

    module purge
    export CLASDVCS_PDF="$gendir"

    ( cd "$gendir" && ./dvcsgen \
        --trig "$nevents" --seed "$seed" --docker \
        --beam "$BEAM_ENERGY" --targ "$TARGET" \
        --x "$XMIN" "$XMAX" --q2 "$Q2MIN" "$Q2MAX" --y "$YMIN" "$YMAX" \
        --t "$TMIN" "$TMAX" --zpos "$ZPOS" --zwidth "$ZWIDTH" \
        --raster "$RASTER" --gpd "$GPD_MODEL" )

    local f
    f=$(find "$gendir" -maxdepth 1 -name '*.dat' ! -name 'gpd.dat' | head -1)
    if [[ -z "$f" ]] || [[ ! -s "$f" ]]; then
        echo "ERROR: dvcsgen did not produce a LUND file" >&2
        return 1
    fi
    mv "$f" "$jobdir/eventfiles/gen.dat"
}
