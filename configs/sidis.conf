# Physics channel config: SIDIS via clasdis
# (https://github.com/JeffersonLab/clasdis).
# Sourced by rivanna_pipeline.slurm when PHYSICS=sidis (the default).
# Must define GCARD_DEFAULT and a run_generator() function that leaves
# the LUND output at "$jobdir/eventfiles/gen.dat". Physics parameters
# live in sidis.params, not here.

GCARD_DEFAULT="rgc_summer2022.gcard"

run_generator() {
    local nevents=$1 seed=$2 jobdir=$3
    source "$SCRIPT_DIR/configs/sidis.params"

    module purge
    export CLASDIS_PDF="$WORKROOT/clasdis/pdf"
    ( cd "$jobdir" && "$WORKROOT/clasdis/clasdis" \
        --trig "$nevents" --seed "$seed" \
        --beam "$BEAM_ENERGY" --targ "$TARGET" \
        --zpos "$ZPOS" --zwidth "$ZWIDTH" --raster "$RASTER" \
        --x "$XMIN" "$XMAX" --q "$Q2MIN" "$Q2MAX" --w "$W2MIN" "$W2MAX" )

    local f
    f=$(find "$jobdir/eventfiles" -maxdepth 1 -name '*.dat' | head -1)
    if [[ -z "$f" ]]; then
        echo "ERROR: clasdis did not produce a LUND file" >&2
        return 1
    fi
    mv "$f" "$jobdir/eventfiles/gen.dat"
}
